name: Update SmartDNS Rules（GFW+AD+IPList）

on:
  schedule:
    - cron: "0 19 * * *"   # UTC 时间 19:00 运行（对应北京时间次日凌晨 03:00）
  workflow_dispatch:       # 允许手动触发

concurrency:
  group: smartdns-rules-update
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码 (使用 v5 消除 Node.js 20 弃用警告)
      - name: Checkout repo
        uses: actions/checkout@v5

      # 2. 构建基础 GFW 规则 (由 build-gfw.sh 处理上游抓取与合并)
      - name: Build gfw.conf
        run: bash build-gfw.sh

      # 3. 精确去重：从 gfw.conf 剔除 local 目录下的自定义域名
      - name: Deduplicate gfw.conf against custom rules
        run: |
          TARGET_FILES=("ai.conf" "git.conf" "other.conf" "tiktok.conf" "z-library.conf" "apkpure.conf")
          EXISTING_FILES=()
          for file in "${TARGET_FILES[@]}"; do
            [ -f "$file" ] && EXISTING_FILES+=("$file")
          done

          if [ ${#EXISTING_FILES[@]} -eq 0 ]; then
            echo "::notice::未找到任何自定义规则文件，跳过去重步骤。"
            exit 0
          fi

          # 提取纯域名并转化为小写
          grep -v '^[[:space:]]*#' "${EXISTING_FILES[@]}" | grep -oE '/[a-zA-Z0-9._-]+/' | awk -F'/' '{print tolower($2)}' | sort -u | grep -v '^$' > custom_domains.txt

          if [ ! -s custom_domains.txt ]; then
            rm -f custom_domains.txt
            exit 0
          fi

          if [ -f "gfw.conf" ]; then
            BEFORE_COUNT=$(wc -l < gfw.conf)
            awk -F'/' '
              function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
              NR==FNR { custom[tolower(trim($1))]=1; next }
              {
                domain = tolower(trim($2))
                if (!(domain in custom)) { print $0 }
              }
            ' custom_domains.txt gfw.conf > gfw.conf.tmp

            mv gfw.conf.tmp gfw.conf
            AFTER_COUNT=$(wc -l < gfw.conf)
            echo "::notice::已成功从 gfw.conf 中剔除 $((BEFORE_COUNT - AFTER_COUNT)) 条与本地规则重复的域名。"
          fi
          rm -f custom_domains.txt

      # 4. 原子化下载与严格语法校验 (整合 AD 规则与 IP 黑白名单)
      - name: Download and validate rules
        run: |
          download_rule() {
            local url="$1"
            local output="$2"
            local tmp="${output}.tmp"

            echo "Downloading ${output}..."
            rm -f "$tmp"

            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 -sS -o "$tmp" "$url" || { echo "::error::下载失败"; rm -f "$tmp"; return 1; }

            # 校验包含 SmartDNS 域名规则及黑白名单特征
            if [ ! -s "$tmp" ] || grep -qi "<html>\|<!DOCTYPE" "$tmp" || ! grep -q -E 'domain /|domain-set|address /|blacklist-ip|whitelist-ip' "$tmp"; then
              echo "::error::${output} 校验失败（空文件/HTML响应/语法错误）！"
              rm -f "$tmp"
              return 1
            fi

            mv "$tmp" "$output"
            echo "::notice::${output} 下载并验证成功。"
          }

          # 下载广告过滤规则
          download_rule "https://anti-ad.net/anti-ad-for-smartdns.conf" "anti-ad-for-smartdns.conf" || exit 1
          download_rule "https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-for-smartdns.txt" "anti-ad-white-for-smartdns.conf" || exit 1
          
          # 下载 IP 黑白名单
          download_rule "https://raw.githubusercontent.com/zxlhhyccc/smartdns-list-scripts/refs/heads/master/blacklist-ip.conf" "blacklist-ip.conf" || exit 1
          download_rule "https://raw.githubusercontent.com/zxlhhyccc/smartdns-list-scripts/refs/heads/master/whitelist-ip.conf" "whitelist-ip.conf" || exit 1

      # 5. 忽略注释与时间戳行对比 (避免产生无意义的 Commit)
      - name: Revert gfw.conf if only timestamp changed
        run: |
          if [ -f "gfw.conf" ] && git show HEAD:gfw.conf >/dev/null 2>&1; then
            grep -v '^[[:space:]]*#' gfw.conf > /tmp/gfw_new.conf || true
            git show HEAD:gfw.conf | grep -v '^[[:space:]]*#' > /tmp/gfw_old.conf || true

            if cmp -s /tmp/gfw_new.conf /tmp/gfw_old.conf; then
              echo "::notice::仅注释变动，内容未改，还原文件。"
              git checkout HEAD -- gfw.conf
            fi
            rm -f /tmp/gfw_new.conf /tmp/gfw_old.conf
          fi

      # 6. 锁定目标文件变更检查
      - name: Check for file changes
        id: git-check
        run: |
          TRACKED_FILES=("gfw.conf" "anti-ad-for-smartdns.conf" "anti-ad-white-for-smartdns.conf" "blacklist-ip.conf" "whitelist-ip.conf")
          if [[ -n $(git status --porcelain -- "${TRACKED_FILES[@]}") ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      # 7. 提交并推送到仓库 (强制使用亚洲/上海时区)
      - name: Commit and push if changed
        id: push_step
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add gfw.conf anti-ad-for-smartdns.conf anti-ad-white-for-smartdns.conf blacklist-ip.conf whitelist-ip.conf
          git commit -m "Auto update SmartDNS rules at $(TZ=Asia/Shanghai date '+%F %T')"
          git push

      # 8. 并行通知客户端 Webhook 更新
      - name: Notify clients to update
        id: notify_step
        if: steps.push_step.outcome == 'success'
        run: |
          notify_client() {
            local client_name=$1
            local webhook_url=$2
            local webhook_secret=$3
            local attempt=1
            local status_code

            if [ -z "$webhook_url" ] || [ -z "$webhook_secret" ]; then
              return 1
            fi

            while [ $attempt -le 3 ]; do
              status_code=$(curl --write-out "%{http_code}" --silent --output /dev/null -X POST -H "X-Hook-Secret: ${webhook_secret}" -H "Content-Length: 0" "${webhook_url}")
              if [[ "$status_code" =~ ^2[0-9][0-9]$ ]]; then
                echo "::notice::Successfully notified ${client_name}"
                return 0
              fi
              sleep 2; ((attempt++))
            done
            return 1
          }

          notify_client "OpenWrt" "${{ secrets.OPENWRT_WEBHOOK_URL }}" "${{ secrets.OPENWRT_WEBHOOK_SECRET }}" &
          OPENWRT_PID=$!

          notify_client "Ubuntu" "${{ secrets.UBUNTU_WEBHOOK_URL }}" "${{ secrets.UBUNTU_WEBHOOK_SECRET }}" &
          UBUNTU_PID=$!

          wait $OPENWRT_PID || OPENWRT_FAILED=1
          wait $UBUNTU_PID || UBUNTU_FAILED=1

          if [ "$OPENWRT_FAILED" = "1" ] || [ "$UBUNTU_FAILED" = "1" ]; then
            exit 1
          fi

      # 9. 生成任务可视化摘要
      - name: Job Summary
        if: always()
        run: |
          echo "### 📊 SmartDNS Rules Task Summary" >> $GITHUB_STEP_SUMMARY
          echo "* **变更状态**: ${{ steps.git-check.outputs.changes == 'true' && '🟡 需更新' || '🟢 无需更新' }}" >> $GITHUB_STEP_SUMMARY
          echo "* **推送状态**: ${{ steps.push_step.outcome || '➖ 跳过' }}" >> $GITHUB_STEP_SUMMARY
          echo "* **Webhook 通知**: ${{ steps.notify_step.outcome || '➖ 跳过' }}" >> $GITHUB_STEP_SUMMARY
