name: Update SmartDNS Rules（GFW+AD+IPList）

on:
  schedule:
    - cron: "0 19 * * *"   # 每天 UTC 19:00 运行（对应中国时间凌晨 3:00）
  workflow_dispatch:       # 允许手动触发

concurrency:
  group: smartdns-rules-update
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码 (使用 v5 消除 Node.js 20 弃用警告)
      - name: Checkout repo
        uses: actions/checkout@v5

      # 2. 构建基础 GFW 规则 (由 build-gfw.sh 处理上游抓取与合并)
      - name: Build gfw.conf
        run: bash build-gfw.sh

      # 3. 精确去重：从 gfw.conf 剔除 local 目录下的自定义域名
      - name: Deduplicate gfw.conf against custom rules
        run: |
          TARGET_FILES=("ai.conf" "git.conf" "other.conf" "tiktok.conf" "z-library.conf" "apkpure.conf")
          EXISTING_FILES=()
          for file in "${TARGET_FILES[@]}"; do
            if [ -f "$file" ]; then
              EXISTING_FILES+=("$file")
            fi
          done

          if [ ${#EXISTING_FILES[@]} -eq 0 ]; then
            echo "::notice::未找到任何自定义规则文件，跳过去重步骤。"
            exit 0
          fi

          # 提取纯域名并转化为小写
          grep -v '^[[:space:]]*#' "${EXISTING_FILES[@]}" | grep -oE '/[a-zA-Z0-9._-]+/' | awk -F'/' '{print tolower($2)}' \vert{} sort -u \vert{} grep -v '^$' > custom_domains.txt

          if [ ! -s custom_domains.txt ]; then
            rm -f custom_domains.txt
            exit 0
          fi

          if [ -f "gfw.conf" ]; then
            BEFORE_COUNT=$(wc -l < gfw.conf)
            awk -F'/' '
              function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
              NR==FNR { custom[tolower(trim($1))]=1; next }
              {
                domain = tolower(trim($2))
                if (!(domain in custom)) { print $0 }
              }
            ' custom_domains.txt gfw.conf > gfw.conf.tmp

            mv gfw.conf.tmp gfw.conf
            AFTER_COUNT=$(wc -l < gfw.conf)
            echo "::notice::已成功从 gfw.conf 中剔除 $((BEFORE_COUNT - AFTER_COUNT)) 条与本地规则重复的域名。"
          fi
          rm -f custom_domains.txt

      # 4. 原子化下载与严格语法校验 (整合 AD 规则与 IP 黑白名单)
      - name: Download and validate rules
        run: |
          download_rule() {
            local output="$1"
            shift
            local urls=("$@")
            local tmp="${output}.tmp"
            local ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

            for url in "${urls[@]}"; do
              echo "Downloading ${output} from${url}..."
              rm -f "$tmp"

              if curl -fL -A "$ua" --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 -sS -o "$tmp" "$url"; then
                # 校验非空、不含 HTML 标签、且包含 SmartDNS 规则特征
                if [ -s "$tmp" ] && ! grep -qi -e "<html" -e "<!DOCTYPE" "$tmp" && grep -q -e "domain /" -e "domain-set" -e "address /" -e "blacklist-ip" -e "whitelist-ip" "$tmp"; then
                  mv "$tmp" "$output"
                  echo "::notice::${output} 下载并验证成功。"
                  return 0
                else
                  echo "::warning::${output} 从 ${url} 下载的文件校验失败（空文件/HTML响应/语法错误），尝试下一个源..."
                fi
              else
                echo "::warning::从 ${url} 下载 ${output} 失败，尝试下一个源..."
              fi
              rm -f "$tmp"
            done

            echo "::error::${output} 所有源均下载或校验失败！"
            return 1
          }

          # 下载广告过滤规则 (优先使用 GitHub Raw 官方仓库源，官网作为备用源)
          if ! download_rule "anti-ad-for-smartdns.conf" \
            "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-smartdns.conf" \
            "https://anti-ad.net/anti-ad-for-smartdns.conf"; then
            exit 1
          fi

          if ! download_rule "anti-ad-white-for-smartdns.conf" \
            "https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-for-smartdns.txt"; then
            exit 1
          fi

          # 下载 IP 黑白名单
          if ! download_rule "blacklist-ip.conf" \
            "https://raw.githubusercontent.com/zxlhhyccc/smartdns-list-scripts/refs/heads/master/blacklist-ip.conf"; then
            exit 1
          fi

          if ! download_rule "whitelist-ip.conf" \
            "https://raw.githubusercontent.com/zxlhhyccc/smartdns-list-scripts/refs/heads/master/whitelist-ip.conf"; then
            exit 1
          fi

      # 5. 忽略注释与时间戳行对比 (避免产生无意义的 Commit)
      - name: Revert gfw.conf if only timestamp changed
        run: |
          if [ -f "gfw.conf" ] && git show HEAD:gfw.conf >/dev/null 2>&1; then
            grep -v '^[[:space:]]*#' gfw.conf > /tmp/gfw_new.conf 2>/dev/null
            git show HEAD:gfw.conf | grep -v '^[[:space:]]*#' > /tmp/gfw_old.conf 2>/dev/null

            if cmp -s /tmp/gfw_new.conf /tmp/gfw_old.conf; then
              echo "::notice::仅注释变动，内容未改，还原文件。"
              git checkout HEAD -- gfw.conf
            fi
            rm -f /tmp/gfw_new.conf /tmp/gfw_old.conf
          fi

      # 6. 锁定目标文件变更检查并抓取具体文件名
      - name: Check for file changes
        id: git-check
        run: |
          TRACKED_FILES=("gfw.conf" "anti-ad-for-smartdns.conf" "anti-ad-white-for-smartdns.conf" "blacklist-ip.conf" "whitelist-ip.conf")
          CHANGED=$(git status --porcelain -- "${TRACKED_FILES[@]}" | awk '{print $2}')
          if [[ -n "$CHANGED" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            # 将换行替换为逗号分隔保存
            echo "changed_files=$(echo "$CHANGED" \vert{} paste -sd "," -)" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "changed_files=none" >> $GITHUB_OUTPUT
          fi

      # 7. 提交并推送到仓库 (强制使用亚洲/上海时区)
      - name: Commit and push if changed
        id: push_step
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add gfw.conf anti-ad-for-smartdns.conf anti-ad-white-for-smartdns.conf blacklist-ip.conf whitelist-ip.conf
          git commit -m "Auto update SmartDNS rules at $(TZ=Asia/Shanghai date '+%F %T')"
          git push

      # 8. 并行通知客户端 Webhook 更新
      - name: Notify clients to update
        id: notify_step
        if: steps.push_step.outcome == 'success'
        run: |
          notify_client() {
            local client_name=$1
            local webhook_url=$2
            local webhook_secret=$3
            local attempt=1
            local status_code

            if [ -z "$webhook_url" -o -z "$webhook_secret" ]; then
              return 1
            fi

            while [ $attempt -le 3 ]; do
              status_code=$(curl --write-out "%{http_code}" --silent --output /dev/null -X POST -H "X-Hook-Secret: ${webhook_secret}" -H "Content-Length: 0" "${webhook_url}")
              if [[ "$status_code" =~ ^2[0-9][0-9]$ ]]; then
                echo "::notice::Successfully notified ${client_name}"
                return 0
              fi
              sleep 2; ((attempt++))
            done
            return 1
          }

          notify_client "OpenWrt" "${{ secrets.OPENWRT_WEBHOOK_URL }}" "${{ secrets.OPENWRT_WEBHOOK_SECRET }}" &
          OPENWRT_PID=$!

          notify_client "Ubuntu" "${{ secrets.UBUNTU_WEBHOOK_URL }}" "${{ secrets.UBUNTU_WEBHOOK_SECRET }}" &
          UBUNTU_PID=$!

          OPENWRT_FAILED=0
          UBUNTU_FAILED=0
          if ! wait $OPENWRT_PID; then
            OPENWRT_FAILED=1
          fi
          if ! wait $UBUNTU_PID; then
            UBUNTU_FAILED=1
          fi

          if [ "$OPENWRT_FAILED" = "1" -o "$UBUNTU_FAILED" = "1" ]; then
            exit 1
          fi

      # 9. 生成包含具体文件明细的任务可视化摘要
      - name: Job Summary
        if: always()
        run: |
          echo "### 📊 SmartDNS Rules Task Summary" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.git-check.outputs.changes }}" = "true" ]; then
            echo "* **变更状态**: 🟡 需更新" >> $GITHUB_STEP_SUMMARY
            echo "* **具体更新文件**:" >> $GITHUB_STEP_SUMMARY
            IFS=',' read -ra FILES <<< "${{ steps.git-check.outputs.changed_files }}"
            for file in "${FILES[@]}"; do
              echo "  - \`$file\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "* **变更状态**: 🟢 无需更新" >> $GITHUB_STEP_SUMMARY
          fi

          PUSH_OUTCOME="${{ steps.push_step.outcome }}"
          echo "* **推送状态**: ${PUSH_OUTCOME:-➖ 跳过}" >> $GITHUB_STEP_SUMMARY

          NOTIFY_OUTCOME="${{ steps.notify_step.outcome }}"
          echo "* **Webhook 通知**: ${NOTIFY_OUTCOME:-➖ 跳过}" >> $GITHUB_STEP_SUMMARY
