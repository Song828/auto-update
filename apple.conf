# ============================================================
# Apple 服务规则
# SmartDNS | 强制走 ext 组 + ipset | 屏蔽 IPv6
# 适用于美区 Apple ID 注册、iCloud、App Store、Siri 等全套服务
# ============================================================

# ---------- 核心主域名 ----------
domain-rules /apple.com/ -nameserver ext -ipset ext -address #6
domain-rules /icloud.com/ -nameserver ext -ipset ext -address #6
domain-rules /icloud.com.cn/ -nameserver ext -ipset ext -address #6
domain-rules /icloud-content.com/ -nameserver ext -ipset ext -address #6
domain-rules /me.com/ -nameserver ext -ipset ext -address #6
domain-rules /mac.com/ -nameserver ext -ipset ext -address #6

# ---------- CDN / 内容分发 / App Store ----------
domain-rules /cdn-apple.com/ -nameserver ext -ipset ext -address #6
domain-rules /aaplimg.com/ -nameserver ext -ipset ext -address #6
domain-rules /mzstatic.com/ -nameserver ext -ipset ext -address #6
domain-rules /appstore.com/ -nameserver ext -ipset ext -address #6
domain-rules /itunes.com/ -nameserver ext -ipset ext -address #6

# ---------- iCloud / CloudKit / 地图 / DNS ----------
domain-rules /apple-cloudkit.com/ -nameserver ext -ipset ext -address #6
domain-rules /apple-livephotoskit.com/ -nameserver ext -ipset ext -address #6
domain-rules /apple-mapkit.com/ -nameserver ext -ipset ext -address #6
domain-rules /apzones.com/ -nameserver ext -ipset ext -address #6
domain-rules /apple-dns.net/ -nameserver ext -ipset ext -address #6

# ---------- 其他官方服务 / 短链 ----------
domain-rules /apple.news/ -nameserver ext -ipset ext -address #6
domain-rules /apple.co/ -nameserver ext -ipset ext -address #6
domain-rules /itun.es/ -nameserver ext -ipset ext -address #6

# ---------- Apple 旗下品牌 / 子公司 ----------
domain-rules /shazam.com/ -nameserver ext -ipset ext -address #6
domain-rules /shazamcharts.com/ -nameserver ext -ipset ext -address #6
domain-rules /beatsbydre.com/ -nameserver ext -ipset ext -address #6
domain-rules /beatsmusic.com/ -nameserver ext -ipset ext -address #6
domain-rules /beats.com/ -nameserver ext -ipset ext -address #6
domain-rules /siri.com/ -nameserver ext -ipset ext -address #6
domain-rules /claris.com/ -nameserver ext -ipset ext -address #6