# =========================================================
# 3. Akamai 边缘节点与静态托管 (已精简防误杀，也可保留你原有的4行)
# =========================================================
domain-rules /tiktok.com.edgesuite.net/ -nameserver ext -ipset ext -address #6
domain-rules /tiktokv.com.edgesuite.net/ -nameserver ext -ipset ext -address #6
